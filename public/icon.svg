<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2c06a"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a8862e"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4aa50"/>
      <stop offset="100%" stop-color="#8a6a20"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Subtle top highlight -->
  <rect x="1" y="1" width="510" height="80" rx="112" fill="white" fill-opacity="0.03"/>

  <!-- DUMBBELL centered at y=210 -->
  <!-- Left plate outer -->
  <rect x="52" y="162" width="52" height="96" rx="10" fill="url(#gold2)" filter="url(#shadow)"/>
  <!-- Left plate inner highlight -->
  <rect x="58" y="168" width="40" height="84" rx="7" fill="url(#gold)" fill-opacity="0.9"/>
  <!-- Left plate edge line -->
  <rect x="94" y="162" width="8" height="96" rx="3" fill="#8a6a20"/>

  <!-- Left inner plate -->
  <rect x="104" y="178" width="30" height="64" rx="6" fill="url(#gold2)"/>
  <rect x="108" y="182" width="22" height="56" rx="4" fill="url(#gold)" fill-opacity="0.85"/>

  <!-- Left collar -->
  <rect x="134" y="186" width="16" height="48" rx="4" fill="#8a6a20"/>
  <rect x="136" y="188" width="12" height="44" rx="3" fill="#c9a84c"/>

  <!-- Handle / bar -->
  <rect x="150" y="198" width="212" height="24" rx="12" fill="url(#gold2)"/>
  <rect x="152" y="200" width="208" height="20" rx="10" fill="url(#gold)"/>
  <!-- Handle grip lines -->
  <line x1="185" y1="201" x2="185" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="205" y1="201" x2="205" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="201" x2="225" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="245" y1="201" x2="245" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="265" y1="201" x2="265" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="285" y1="201" x2="285" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="305" y1="201" x2="305" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="325" y1="201" x2="325" y2="219" stroke="#8a6a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Right collar -->
  <rect x="362" y="186" width="16" height="48" rx="4" fill="#8a6a20"/>
  <rect x="364" y="188" width="12" height="44" rx="3" fill="#c9a84c"/>

  <!-- Right inner plate -->
  <rect x="378" y="178" width="30" height="64" rx="6" fill="url(#gold2)"/>
  <rect x="382" y="182" width="22" height="56" rx="4" fill="url(#gold)" fill-opacity="0.85"/>

  <!-- Right plate outer -->
  <rect x="410" y="162" width="52" height="96" rx="10" fill="url(#gold2)" filter="url(#shadow)"/>
  <rect x="416" y="168" width="40" height="84" rx="7" fill="url(#gold)" fill-opacity="0.9"/>
  <!-- Right plate edge -->
  <rect x="410" y="162" width="8" height="96" rx="3" fill="#8a6a20"/>

  <!-- Gold divider line -->
  <line x1="156" y1="340" x2="356" y2="340" stroke="#c9a84c" stroke-opacity="0.35" stroke-width="1"/>

  <!-- LB wordmark -->
  <text x="256" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="14" fill="#c9a84c" fill-opacity="0.95">LB</text>

  <!-- LIFESTYLE BODY -->
  <text x="256" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c9a84c" fill-opacity="0.4">LIFESTYLE BODY</text>
</svg>
